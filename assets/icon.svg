<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="50%" stop-color="#00ff00"/>
      <stop offset="100%" stop-color="#0000ff"/>
    </linearGradient>
    <radialGradient id="gradient3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  
  <!-- Fond circulaire avec dégradé psychédélique -->
  <circle cx="128" cy="128" r="120" fill="url(#gradient1)" opacity="0.8"/>
  
  <!-- Cercles concentriques -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#gradient2)" stroke-width="8" opacity="0.9"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#gradient1)" stroke-width="6" opacity="0.8"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="url(#gradient2)" stroke-width="4" opacity="0.9"/>
  
  <!-- Formes géométriques -->
  <rect x="64" y="64" width="48" height="48" fill="url(#gradient2)" opacity="0.7" transform="rotate(45 128 128)"/>
  <rect x="144" y="64" width="48" height="48" fill="url(#gradient1)" opacity="0.7" transform="rotate(-45 128 128)"/>
  <rect x="64" y="144" width="48" height="48" fill="url(#gradient2)" opacity="0.7" transform="rotate(45 128 128)"/>
  <rect x="144" y="144" width="48" height="48" fill="url(#gradient1)" opacity="0.7" transform="rotate(-45 128 128)"/>
  
  <!-- Triangles -->
  <polygon points="128,32 96,80 160,80" fill="url(#gradient3)" opacity="0.6"/>
  <polygon points="128,224 96,176 160,176" fill="url(#gradient3)" opacity="0.6"/>
  <polygon points="32,128 80,96 80,160" fill="url(#gradient3)" opacity="0.6"/>
  <polygon points="224,128 176,96 176,160" fill="url(#gradient3)" opacity="0.6"/>
  
  <!-- Centre -->
  <circle cx="128" cy="128" r="20" fill="url(#gradient3)" opacity="0.9"/>
  <circle cx="128" cy="128" r="10" fill="white" opacity="0.8"/>
</svg>
