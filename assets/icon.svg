<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151c36"/>
      <stop offset="100%" stop-color="#070a16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff3ddb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="62%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#7c4dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="448" height="448" rx="104"/>
    </clipPath>
  </defs>

  <!-- Tile background + soft neon glow -->
  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="448" height="448" fill="url(#bg)"/>
    <rect x="32" y="32" width="448" height="448" fill="url(#glow)"/>
  </g>

  <!-- Neon border -->
  <rect x="37" y="37" width="438" height="438" rx="99" fill="none"
        stroke="url(#neon)" stroke-width="10"/>

  <!-- Equalizer bars forming a "V" (Visualize) -->
  <g fill="url(#neon)">
    <rect x="66"  y="106" width="52" height="300" rx="26"/>
    <rect x="148" y="166" width="52" height="180" rx="26"/>
    <rect x="230" y="196" width="52" height="120" rx="26"/>
    <rect x="312" y="166" width="52" height="180" rx="26"/>
    <rect x="394" y="106" width="52" height="300" rx="26"/>
  </g>
</svg>
