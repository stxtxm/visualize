name: Windows Build

on:
  push:
    branches:
      - windows-build
      - master
    tags:
      - 'v*'
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (choco)
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate test audio
        run: python scripts/gen_test_audio.py

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          NO_SOUND: "1"
          SDL_VIDEODRIVER: "dummy"
          SDL_AUDIODRIVER: "dummy"
          PYTHONIOENCODING: "utf-8"

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/windows-build'
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (choco)
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg for bundling
        run: python scripts/download_ffmpeg_windows.py ffmpeg_bin

      - name: Build with PyInstaller
        run: python -m PyInstaller build_windows.spec --clean
        env:
          NO_SOUND: "1"

      - name: Build NSIS installer
        shell: powershell
        run: |
          choco install nsis -y --no-progress 2>&1 | Out-Null
          $nsis = Get-ChildItem -Path "C:\Program Files\NSIS\makensis.exe", "C:\Program Files (x86)\NSIS\makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Write-Host "Building installer with: $($nsis.FullName)"
            & $nsis.FullName installer.nsi
          } else {
            # Try PATH
            $exe = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($exe) {
              Write-Host "Building installer with makensis from PATH"
              makensis.exe installer.nsi
            } else {
              Write-Host "NSIS not available, skipping installer"
            }
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visualize_Portable
          path: dist/Visualize_portable/
          compression-level: 0

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visualize_Installer
          path: "*.exe"
          compression-level: 0

      - name: Upload to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Visualize_*.exe
            dist/Visualize_portable/
          generate_release_notes: false
          fail_on_unmatched_files: false
