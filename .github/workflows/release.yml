name: Build & Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 portaudio19-dev ffmpeg \
            libgl1 libglib2.0-0 libx11-6 libxext6 libxrender1 \
            libsm6

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate test audio
        run: python3 scripts/gen_test_audio.py

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

      - name: Run export test
        run: python3 tests/test_export.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        run: bash build_standalone.sh
        env:
          CONTAINER_CMD: docker

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist_standalone/Visualisateur_Psychedelic.AppImage

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Visualisateur_Psychedelic.AppImage
          body: |
            ## Release v0.0.4

            Visualisateur Psychédélique autonome.

            Correctifs et améliorations :
            - **Dialogues de fichiers personnalisés** — Les boîtes de sélection audio et d'export vidéo sont remplacées par un dialogue maison au thème sombre/néon de l'application : texte lisible (police 11, contraste élevé), champ de saisie confortable, navigation dossiers (🏠 / ⬆), filtres par type, et double-clic. Corrige le texte illisible et la saisie difficile sur Fedora (Wayland/GNOME) et dans l'AppImage sandboxée.
            - **Dialogue modal fiable** — `parent` + `grab_set()` garantissent que le dialogue apparaît au-dessus de la fenêtre principale.
            - **Rendu Classic unifié** — L'effet Neon Equalizer utilise un pipeline unique `render_to_array()` pour l'aperçu et l'export.
            - **Versionnage dynamique** — La version est calquée sur le tag Git et affichée dans la fenêtre.
            - **Build robuste** — Détection Podman/Docker, correction des permissions d'extraction sur CI.

