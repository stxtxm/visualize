name: Build & Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 portaudio19-dev ffmpeg \
            libgl1 libglib2.0-0 libx11-6 libxext6 libxrender1 \
            libsm6

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate test audio
        run: python3 scripts/gen_test_audio.py

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

      - name: Run export test
        run: python3 tests/test_export.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        run: bash build_standalone.sh
        env:
          CONTAINER_CMD: docker

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist_standalone/Visualisateur_Psychedelic.AppImage

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Visualisateur_Psychedelic.AppImage
          body: |
            ## Release v0.0.3

            Visualisateur Psychédélique autonome.

            Correctifs et améliorations :
            - **Dialogue d'export corrigé** — La boîte de dialogue « Enregistrer la vidéo » s'ouvre désormais correctement (avec `parent` pour éviter qu'elle ne passe derrière la fenêtre) et démarre dans le dossier personnel de l'utilisateur, même au sein de l'AppImage sandboxée.
            - **Dialogue d'ouverture audio** — Même robustesse pour la sélection du fichier audio (`parent` + dossier personnel fiable).
            - **Rendu Classic unifié** — L'effet Neon Equalizer utilise un pipeline unique `render_to_array()` pour l'aperçu et l'export.
            - **Versionnage dynamique** — La version est calquée sur le tag Git et affichée dans la fenêtre.
            - **Build robuste** — Détection Podman/Docker, correction des permissions d'extraction sur CI.

