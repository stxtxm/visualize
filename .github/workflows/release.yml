name: Build & Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 portaudio19-dev ffmpeg \
            libgl1 libglib2.0-0 libx11-6 libxext6 libxrender1 \
            libsm6

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate test audio
        run: python3 scripts/gen_test_audio.py

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

      - name: Run export test
        run: python3 tests/test_export.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        run: bash build_standalone.sh
        env:
          CONTAINER_CMD: docker

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist_standalone/Visualisateur_Psychedelic.AppImage

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Visualisateur_Psychedelic.AppImage
          body: |
            ## Release v0.0.6

            Standalone Psychedelic Visualizer.

            Fixes and improvements:
            - **File dialog crash fix (`AttributeError: 'FileDialog' object has no attribute 'listbox'`) — 2-element `padx`/`pady` tuples passed to the widget constructor (`tk.Frame(..., pady=(4, 8))`) are rejected by this Tk version (``bad screen distance``); they are now applied via `.pack(pady=(4, 8))`, allowing `_build_ui` to create `self.listbox`.**
            - **File dialog: enhanced borders and contrast (readable on dark backgrounds).**
            - **Default open in user home directory, including within the AppImage (`APPDIR` detection).**
            - Custom file dialogs — Audio selection and video export dialogs replaced with a custom dark/neon-themed dialog matching the application: readable text (font size 11, high contrast), comfortable input field, folder navigation (🏠 / ⬆), type filters, and double-click support. Fixes unreadable text and difficult input on Fedora (Wayland/GNOME) and in the sandboxed AppImage.
            - Reliable modal dialog — `parent` + `grab_set()` ensure the dialog appears above the main window.
            - Unified Classic rendering — The Neon Equalizer effect uses a single `render_to_array()` pipeline for both preview and export.
            - Dynamic versioning — Version is derived from the Git tag and displayed in the window title.
            - Robust build — Podman/Docker detection, fixed extraction permissions on CI.

